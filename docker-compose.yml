# Team-local PostgreSQL 16 (ADR-004). Usage: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmatrack
      POSTGRES_PASSWORD: pharmatrack
      POSTGRES_DB: pharmatrack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmatrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
