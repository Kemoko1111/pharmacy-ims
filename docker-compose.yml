# Team-local PostgreSQL 17 (ADR-004). Usage: docker compose up -d
#
# Matches the Neon production server, which auto-upgraded to 17 after ADR-004
# was written. Coming from the old 16 image, the existing volume holds a data
# directory 17 will refuse to start on — run `docker compose down -v` once to
# drop it. It is dev data only; the test database is recreated by the suite.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmatrack
      POSTGRES_PASSWORD: pharmatrack
      POSTGRES_DB: pharmatrack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmatrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
