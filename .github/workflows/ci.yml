# Lint + test on every PR (project-plan.md §6); formalized as the Week 8
# CI/CD deliverable. Deploys to Render/Vercel hang off main once accounts exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major as the Neon production server (17), so a migration that
        # only works on one of them fails here rather than on the client's data.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pharmatrack
          POSTGRES_PASSWORD: pharmatrack
          POSTGRES_DB: pharmatrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmatrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared contract
        run: pnpm --filter @pharmatrack/shared build

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm --filter @pharmatrack/api db:generate

      - name: API build
        run: pnpm --filter @pharmatrack/api build

      - name: API unit tests
        run: pnpm --filter @pharmatrack/api test:unit

      - name: API e2e tests
        run: pnpm --filter @pharmatrack/api test
        env:
          TEST_DATABASE_URL: postgresql://pharmatrack:pharmatrack@localhost:5432/pharmatrack_test

      - name: Web build
        run: pnpm --filter @pharmatrack/web build

      # Runs last and reports rather than gates. It previously sat before the
      # build/test steps, so a single unfixable transitive advisory aborted the
      # run before anything was actually tested — CI was red on main from
      # 2026-07-24 without once executing the test suite. A check that blocks on
      # something the project cannot fix stops being a check and starts hiding
      # the ones that matter.
      #
      # The findings are still surfaced in the job log for the OWASP A06
      # evidence. All six are transitive; the only one that ships to users is
      # react-router (RSC-mode CSRF), and this app is a Vite SPA, so it is not
      # reachable here. Fix properly by bumping react-router-dom to >=8.3.0 —
      # a major upgrade that deserves its own PR — then restore the gate.
      - name: Dependency audit (OWASP A06)
        run: pnpm audit --audit-level high
        continue-on-error: true
