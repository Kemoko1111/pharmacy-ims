# Nightly pg_dump (ADR-007 / NFR-07). No-op until the PROD_DATABASE_URL
# secret exists (set it to the Neon URL after the Render deploy). Artifacts keep 30 days.
name: DB backup

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC nightly
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        id: check
        run: |
          if [ -n "${{ secrets.PROD_DATABASE_URL }}" ]; then
            echo "have_url=true" >> "$GITHUB_OUTPUT"
          else
            echo "PROD_DATABASE_URL not set — skipping (expected before first deploy)"
          fi

      # pg_dump refuses to dump a server newer than itself. Neon upgraded the
      # managed instance to PostgreSQL 17 and this was still pinned to 16, so
      # every nightly run from 2026-07-27 failed with "server version mismatch"
      # and NO backup was produced. Keep this image's major >= the Neon server
      # major; a newer client can always dump an older server, so bump this
      # ahead of, not behind, the next Neon upgrade.
      - name: Dump
        if: steps.check.outputs.have_url == 'true'
        run: |
          docker run --rm postgres:17-alpine \
            pg_dump --no-owner --format=custom "${{ secrets.PROD_DATABASE_URL }}" \
            > pharmatrack-$(date +%F).dump
          # A dump that silently produced nothing is worse than a loud failure.
          test -s pharmatrack-$(date +%F).dump
          echo "dump size: $(du -h pharmatrack-$(date +%F).dump | cut -f1)"

      - name: Upload artifact
        if: steps.check.outputs.have_url == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pharmatrack-backup-${{ github.run_id }}
          path: pharmatrack-*.dump
          retention-days: 30
